name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3 scikit-learn==1.7.2 fastapi==0.119.1 httpx==0.28.1 ruff black
      - run: ruff check src scripts tests
      - run: black --check src scripts tests
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python scripts/verify_freeze.py
